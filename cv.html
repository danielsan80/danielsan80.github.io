<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Danilo Sanchi — CV</title>
    <meta
      name="description"
      content="Il CV di Danilo Sanchi, software engineer: ruoli, progetti, formazione e competenze, in una pagina stampabile."
    />
    <meta name="robots" content="noindex" />
    <script>
      try {
        const theme = localStorage.getItem("theme");
        if (theme === "light" || theme === "dark") {
          document.documentElement.dataset.theme = theme;
        }
        // Arriving from the site, the language was chosen on the way here.
        if (
          localStorage.getItem("lang") === "en" &&
          !document.referrer.startsWith(`${location.origin}/`)
        ) {
          location.replace(`/en${location.pathname}`);
        }
      } catch {
        // No storage, no stored choice: the system theme, in Italian.
      }
    </script>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="canonical" href="https://danilosanchi.net/cv" />
    <link rel="alternate" hreflang="it" href="https://danilosanchi.net/cv" />
    <link rel="alternate" hreflang="en" href="https://danilosanchi.net/en/cv" />
    <link
      rel="alternate"
      hreflang="x-default"
      href="https://danilosanchi.net/cv"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/pages/cv/main.tsx"></script>
  </body>
</html>
