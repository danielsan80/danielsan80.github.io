<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Danilo Sanchi — CV</title>
    <meta
      name="description"
      content="Il CV di Danilo Sanchi, software engineer: ruoli, progetti, formazione e competenze, in una pagina stampabile."
    />
    <meta name="robots" content="noindex" />
    <script>
      try {
        const theme = localStorage.getItem("theme");
        if (theme === "light" || theme === "dark") {
          document.documentElement.dataset.theme = theme;
        }
      } catch {
        // No storage, no stored theme: the page follows the system.
      }
    </script>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="canonical" href="https://danilosanchi.net/cv" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/pages/cv/main.tsx"></script>
  </body>
</html>
