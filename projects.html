<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Danilo Sanchi — Progetti</title>
    <meta
      name="description"
      content="I progetti di Danilo Sanchi e i suoi repository GitHub, raccolti per topic."
    />
    <script>
      try {
        const theme = localStorage.getItem("theme");
        if (theme === "light" || theme === "dark") {
          document.documentElement.dataset.theme = theme;
        }
        // Arriving from the site, the language was chosen on the way here.
        if (
          localStorage.getItem("lang") === "en" &&
          !document.referrer.startsWith(`${location.origin}/`)
        ) {
          location.replace(`/en${location.pathname}`);
        }
      } catch {
        // No storage, no stored choice: the system theme, in Italian.
      }
    </script>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="canonical" href="https://danilosanchi.net/projects" />
    <link
      rel="alternate"
      hreflang="it"
      href="https://danilosanchi.net/projects"
    />
    <link
      rel="alternate"
      hreflang="en"
      href="https://danilosanchi.net/en/projects"
    />
    <link
      rel="alternate"
      hreflang="x-default"
      href="https://danilosanchi.net/projects"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/pages/projects/main.tsx"></script>
  </body>
</html>
