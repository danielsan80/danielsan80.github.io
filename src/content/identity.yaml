name: Danilo Sanchi
portrait:
  src: /photos/portrait.webp
  alt:
    it: Danilo in viaggio, con un lemure
    en: Danilo travelling, with a lemur
channels:
  home:
    headline:
      - [Senior software engineer, Hands-on consultant]
      - [Clean code lover, Hearthian at heart]
    summary:
      it: "Sono un esploratore e un costruttore: se potessi, passerei le giornate tra il computer e il garage a sperimentare, imparare e inventare. Nel lavoro porto la stessa curiosità: studio, provo, mi confronto, e cerco la soluzione che crea più valore, anche a costo di buttare codice o di non scriverlo affatto. Non mi limito a sviluppare: miglioro i processi, insegno e imparo. Nell'AI non vedo solo un modo di andare più veloci, ma l'occasione di ripagare finalmente il debito tecnico e di conoscenza che il software si porta dietro."
      en: "I am an explorer and a builder: if I could, I would spend my days between the computer and the garage, experimenting, learning and inventing. I bring the same curiosity to work: I study, try things out, compare notes, and look for the solution that creates the most value, even if it means throwing code away or not writing it at all. I don't stop at development: I improve processes, teach and learn. In AI I see more than a way to go faster: I see the chance to finally pay back the technical and knowledge debt that software carries."
  cv:
    headline: Senior Software Engineer & Hands-on Consultant · Freelance
    summary:
      it: Sviluppo applicazioni web dal 2007, come freelance dal 2013. Mi piace scrivere codice pulito che risolva problemi in modo elegante ed efficace. Punto a generare il massimo valore con il minimo costo, ma senza trascurare la qualità. Credo che far bene significhi testare, modellare con cura, confrontarsi con i colleghi, automatizzare il controllo delle scelte fatte. Sono aperto a collaborazioni sia come freelance che come dipendente, purché l'ambiente sia informale e contino le persone e le idee, più che le etichette.
      en: I have been building web applications since 2007, as a freelancer since 2013. I like writing clean code that solves problems in an elegant and effective way. I aim to deliver the most value at the least cost, without giving up on quality. To me, doing things well means testing, modeling with care, discussing with colleagues and automating the checks on the decisions we make. I am open to both freelance and employed positions, as long as the environment is informal and people and ideas matter more than labels.
