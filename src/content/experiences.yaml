- role:
    it: Full Stack Developer
    en: Full Stack Developer
  company: Facile.it SpA
  location:
    it: Milano
    en: Milan
  remote: true
  period:
    start: "2025-08"
    end: "2026-03"
  notes: |-
    Sono stato ingaggiato per contribuire allo sviluppo di nuove funzionalità del CRM interno di Facile.it, un'applicazione Symfony 7 su PHP 8 che gestiva l'operatività degli store fisici: anagrafiche, lead, appuntamenti, prodotti, permessi. Lavoravo nel team seguendo i rituali Scrum.
    Il team era misto tra dipendenti e freelance, con due product owner e un coordinamento tra più team: il CRM si integrava con altri applicativi interni per la generazione di PDF, l'invio di email con accesso autenticato e lo scambio via Google Pub/Sub degli eventi CRUD che interessavano noi o gli altri applicativi.
    Oltre alle funzionalità ho portato il mio punto di vista su architettura esagonale e Domain-Driven Design, mostrando come avrei organizzato il codice e contribuendo alla migrazione verso un modello a domini. Ho imparato molto anche dai colleghi.
  cv:
    it:
      - Sviluppo di nuove funzionalità del CRM interno per la gestione dell'operatività degli store fisici.
      - Integrazione con gli altri applicativi interni all'azienda, via Google Pub/Sub.
      - Sviluppo in team con Scrum, portando l'esperienza su architettura esagonale e DDD.
    en:
      - Development of new features for the internal CRM managing the operations of the physical stores.
      - Integration with the company's other in-house applications, over Google Pub/Sub.
      - Development in a Scrum team, bringing my experience with hexagonal architecture and DDD.
  linkedin:
    it: |-
      Ho sviluppato nuove funzionalità del CRM interno lavorando nel team con i rituali Scrum, e ne ho curato l'integrazione con gli altri applicativi aziendali, scambiando eventi CRUD via Google Pub/Sub.
      Oltre alle funzionalità ho portato il mio punto di vista su architettura esagonale e Domain-Driven Design, mostrando come avrei organizzato il codice e contribuendo alla migrazione verso un modello a domini. Ho imparato molto anche dai colleghi.
    en: |-
      I developed new features for the internal CRM working within the team's Scrum rituals, and I handled its integration with the other in-house applications, exchanging CRUD events over Google Pub/Sub.
      Beyond the features I brought my own perspective on hexagonal architecture and Domain-Driven Design, showing how I would organize the code and contributing to the migration towards a domain model. I also learned a lot from my colleagues.
