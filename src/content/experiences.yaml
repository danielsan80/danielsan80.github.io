- role:
    it: Consulente e Full Stack Developer
    en: Consultant & Full Stack Developer
  company: Resolvi Srl
  location: Riccione
  remote: true
  period:
    start: "2026-08"
  notes: |-
    Sono entrato in Resolvi per dare supporto allo sviluppo di nuove funzionalità. Durante l'onboarding ho usato Claude Code per analizzare il progetto e mi sono reso conto che c'era del lavoro propedeutico più urgente.
    Ho isolato l'ambiente di sviluppo: l'applicativo non partiva senza rete, perché si appoggiava al backoffice, a Firebase e a un CouchDB online. Su quella base abbiamo scritto con Claude i test end-to-end in Playwright sui flussi principali, come rete di sicurezza per la migrazione da Angular 18 a 20, e ho rivisto e migrato la suite di test da Karma/Jasmine a Vitest e da Cypress a Playwright, ripristinandone il lancio in CI.
    In parallelo ho impostato CLAUDE.md, permessi e skill per un uso avanzato di Claude Code nel processo di sviluppo, trasferendo le pratiche allo sviluppatore del team.
    Tutto questo in pochi giorni di lavoro. Lo sviluppo di nuove funzionalità è il passo successivo.
  cv:
    it:
      - "Isolamento dell'ambiente di sviluppo: applicativo eseguibile in locale senza rete, svincolato da backoffice, Firebase e CouchDB."
      - Test end-to-end in Playwright sui flussi principali dell'app, scritti come rete di sicurezza per la migrazione da Angular 18 a 20.
      - Ripristino della suite di test in CI come prerequisito al deploy, con migrazione da Karma/Jasmine a Vitest e da Cypress a Playwright.
      - Impostazione di CLAUDE.md, permessi e skill per un uso avanzato di Claude Code, con trasferimento delle pratiche allo sviluppatore del team.
    en:
      - "Isolated the development environment: the app runs locally with no network, decoupled from back office, Firebase and CouchDB."
      - End-to-end tests in Playwright covering the app's main flows, written as a safety net for the Angular 18 to 20 migration.
      - Restored the test suite in CI as a prerequisite for deployment, migrating it from Karma/Jasmine to Vitest and from Cypress to Playwright.
      - Set up CLAUDE.md, permissions and skills for an advanced use of Claude Code, passing the practices on to the team's developer.
  linkedin:
    it: |-
      Sono entrato per dare supporto allo sviluppo, ma dall'onboarding è emerso del lavoro propedeutico più urgente.
      Ho isolato l'ambiente di sviluppo, che senza rete non partiva, rendendolo eseguibile in locale. Su quella base ho scritto con Claude i test end-to-end in Playwright sui flussi principali, come rete di sicurezza per la migrazione da Angular 18 a 20, e ho rivisto e migrato la suite di test da Karma/Jasmine a Vitest e da Cypress a Playwright, rimettendola in CI come prerequisito al deploy.
      In parallelo ho impostato CLAUDE.md, permessi e skill per un uso avanzato di Claude Code, trasferendo le pratiche allo sviluppatore del team. Tutto in pochi giorni di lavoro, e le nuove funzionalità sono il passo successivo.
    en: |-
      I joined to support development, but onboarding surfaced more urgent groundwork.
      I isolated the development environment, which would not start without a network, and made it runnable locally. On that basis I wrote, with Claude, the end-to-end Playwright tests covering the main flows, as a safety net for the Angular 18 to 20 migration, and I reviewed and migrated the test suite from Karma/Jasmine to Vitest and from Cypress to Playwright, putting it back in CI as a prerequisite for deployment.
      In parallel I set up CLAUDE.md, permissions and skills for an advanced use of Claude Code, passing the practices on to the team's developer. All in a few days of work, and new features are the next step.
