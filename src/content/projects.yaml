- name: Mini Race Challenge
  role: contributor
  period:
    start: "2018-11"
  notes: |-
    Il progetto è di mio fratello Paolo: nato come un suo hobby, a cui mi ero
    appassionato, poi diventato un prodotto artigianale e infine un business,
    che ha richiesto l'apertura di una partita IVA. Io lo seguo e do una mano
    quando serve. La data d'inizio è quella della prima foto trovata; il
    progetto è in corso.

    L'esigenza di partenza: fare gare con molte auto RC in miniatura in salotto,
    nelle associazioni e nei locali. Una soluzione non c'era; dopo vari
    esperimenti si è provato con l'NFC, e ha funzionato. Il nodo era che l'NFC
    rileva punto a punto, mentre a noi serviva linea a punto: alla fine abbiamo
    letteralmente segato un rilevatore puntuale e l'abbiamo esteso con un cavo
    parallelo, che faceva da antenna lineare sotto il traguardo. Così erano il
    prototipo e la prima versione artigianale, venduta ai primi appassionati
    tra privati. Oggi la scheda è rifatta da zero, non contiene più il
    rilevatore originario e l'antenna è pluggabile.

    Oggi MRC è un brand che produce diversi dispositivi, tutti con lo scopo di
    gestire gare tra auto RC di piccole dimensioni. Il dispositivo centrale è un
    lap counter NFC: un tag sotto ogni auto e, sotto la linea di partenza,
    l'antenna lineare anziché le convenzionali antenne NFC puntuali. Comunica
    in Bluetooth LE con la web app, traspilata anche per iOS e Android.

    Da gennaio 2026 il progetto è gestito da LimenLab, azienda aperta
    principalmente per MRC ma con l'intenzione di realizzare altri progetti
    pionieristici e "di confine".

    I prodotti sono venduti in tutto il mondo tramite rivenditori sul
    territorio; quelli consolidati: uno a Milano, uno in Messico, due in
    Germania, uno in Francia e uno in Giappone.

    Come viene usato:

    - A Città del Messico il distributore, Victor Babani (Vic's Pulse Timing),
      organizza tornei da 30-60 persone nel suo locale, con le Turbo Racing in
      scala 1:76. Un esempio: 24 settembre 2026, Parque Toreo, pista "F04
      México Pegaso", ispirata al tracciato del mondiale IFMAR 1997.
    - In Spagna, a settembre 2026, un evento con il club Drift Frutando, sulle
      piste Carrera Hybrid: il timing system esce dalle sole auto RC.
    - In Giappone il distributore aveva l'incarico di realizzare circuiti
      dioramici in un parco a tema a Tokyo; non se n'è saputo più nulla.
    - Molti clienti costruiscono diorami trasportabili su cui montano il timing
      system e ci gareggiano con le Turbo Racing.
    - A Jesi l'associazione Jesi Drift organizza giornate di gioco in una
      villetta di proprietà, con tornei e gare libere, e tiene una classifica
      generale dei piloti: più partecipi e più punti fai, più sali. Senza MRC
      non potrebbero farlo; Paolo, quando può, va a giocare con loro. A ottobre
      2026 provano a portare il format in un pub, che è quello che facevamo noi
      all'inizio.


    Il mio contributo: idee e soluzioni, ma soprattutto i modelli 3D necessari
    ai prodotti, modellati in OpenSCAD e inizialmente stampati in casa con una
    FDM, oggi tramite servizi esterni. I prototipi stampati hanno sostenuto la
    fase di ricerca e il play testing nelle associazioni; alcuni sono diventati
    prodotti, altri componenti open source da stampare in autonomia.

    - Gantry: open source, su GitHub e Thingiverse con licenza Creative
      Commons. Al 25/09/2026 su Thingiverse: più di 5500 visualizzazioni, 67
      like, più di 2058 download. Compare spesso nei video che la gente
      pubblica delle proprie gare e dei propri diorami.
    - Start lights: fa parte del prodotto venduto. Il modulo start lights
      estende il lap counter con un semaforino collegato all'app; il
      contenitore a forma di semaforo è il mio modello, adattato per la stampa
      in resina tramite servizio esterno. È anche open source, ma la versione
      pubblicata potrebbe non essere l'ultima: se quello in dotazione si rompe,
      lo si può ristampare, insieme alle clip generiche per appenderlo a
      qualcosa o a quelle che lo agganciano al gantry.
    - Box dell'unità principale: conteneva la prima versione, oggi non più
      usato, sostituito da una scatolina in commercio.
    - Dispositivo per firmare i tag, l'ultimo lavoro: srotola la bobina di tag
      facendoli passare uno a uno sull'antenna. L'app lo governa, automatizzando
      un processo che prima era manuale e noioso (ogni bobina contiene 5000
      tag). In ciascun tag viene scritto un identificativo firmato (forse un
      token tipo JWT), memorizzato nel db. Il lap counter funziona solo con i
      tag MRC, per ragioni di business e di responsabilità, garanzia e
      assistenza.
  channels:
    site:
      it: >-
        Con mio fratello volevamo fare gare indoor con molte auto RC in
        miniatura, grandi quanto una Hot Wheels, in salotto, nelle associazioni
        e nei locali. Una soluzione non c'era e l'abbiamo creata noi, con l'NFC:
        oggi il nostro timing system è usato in tutto il mondo. Il mio
        contributo sono i modelli 3D: prototipi per la ricerca e il play
        testing, poi diventati prodotti o componenti open source, come il gantry
        che ritrovo nei video delle gare altrui.
      en: >-
        With my brother, we wanted to race lots of tiny, Hot Wheels-sized RC
        cars indoors, in living rooms, clubs and bars. Nothing out there could
        do it, so we built it ourselves, with NFC: today our timing system is
        used all over the world. My part is the 3D models: prototypes for
        research and playtesting, which then became products or open source
        parts, like the gantry I keep spotting in other people's race videos.
    cv:
      it: >-
        Cronometraggio per auto RC di piccole dimensioni, nato come hobby e
        diventato un piccolo business internazionale: il cuore è un contagiri
        basato su NFC. Contribuisco con la parte 3D, modellata in OpenSCAD:
        gantry e start lights sono open source su GitHub e Thingiverse.
      en: >-
        A timing system for small RC cars, born as a hobby and now a small
        international business, built around an NFC lap counter. I contribute
        the 3D side, modelled in OpenSCAD: the gantry and the start lights are
        open source on GitHub and Thingiverse.
    linkedin:
      it: >-
        È un progetto nato come hobby, poi diventato un piccolo business
        internazionale: il cuore è un contagiri basato su tecnologia NFC,
        altamente affidabile, che permette di fare gare e tornei con macchine RC
        di piccole dimensioni.


        Contribuisco a questo progetto occupandomi della componente 3D,
        attraverso modellazione e stampa (utilizzando OpenSCAD).


        In particolare, ho realizzato il gantry e le start lights, rendendoli
        disponibili open source su GitHub e Thingiverse con licenza Creative
        Commons.
      en: >-
        A project born as a hobby and now a small international business: at its
        heart is a highly reliable NFC lap counter that makes races and
        tournaments with small RC cars possible.


        I contribute to it by taking care of the 3D side, through modelling and
        printing (using OpenSCAD).


        In particular I built the gantry and the start lights, and published
        them open source on GitHub and Thingiverse under a Creative Commons
        licence.
  links:
    - label: miniracechallenge.com
      url: https://miniracechallenge.com/
    - label: Thingiverse
      url: https://www.thingiverse.com/thing:5364319
    - label: Repository
      url: https://github.com/danielsan80/minirace-gate
  highlight:
    photo:
      src: /photos/mini-race-challenge.webp
      alt:
        it: Gara tra auto RC in scala 1:58 su un circuito fatto in casa, in stile post-apocalittico
        en: A race of 1:58 RC cars on a homemade, post-apocalyptic track
- name: QRiddle
  role: author
  period:
    start: "2025-12"
  notes: |-
    Nasce da un regalo. Dovevo andare in Kosovo con mia moglie e degli amici a
    cavallo del suo compleanno, e le avevo preso un ciondolo artigianale, fatto
    dalla sorella di un collega, che non volevo portare in aereo. Così l'ho
    nascosto nella scatola di un gioco da tavolo della nostra libreria e ho
    girato un video che mostrava dov'era: il link a quel video è finito in un QR
    code, sul biglietto d'auguri che le avrei dato il giorno del compleanno. Il
    QR code è il regalo, il biglietto è la strada per arrivarci.

    Poi l'idea vera: non stampare il QR code in chiaro, ma farglielo ricavare
    annerendo le caselle. Quattro puzzle, uno per ciascuno dei quattro settori
    delimitati dalle pieghe del biglietto: crucipixel, parole crociate, un
    settore da mettere in controluce annerendo in corrispondenza delle parole
    scritte sull'altro lato, e paint by area.

    Quel biglietto l'ho fatto a mano con Inkscape. A bocce ferme mi sono detto
    che automatizzare la creazione del biglietto e dei puzzle sarebbe stato
    bello: in particolare il paint by area, il più noioso da disegnare e il più
    stimolante da generare. La domanda interessante era come creare le aree
    labirintiche da annerire.

    Da fare, idealmente: altri puzzle, per rendere la sfida più stimolante. Il
    paint by area, come enigma, è piuttosto banale.
  channels:
    site:
      it: >-
        Nasce da un biglietto d'auguri per mia moglie: il QR code che portava al
        suo regalo andava ricavato annerendo le caselle di quattro puzzle.
        Quello l'avevo disegnato a mano con Inkscape; QRiddle è la web app che
        ora lo fa da sola, e il pretesto per imparare React e TypeScript
        sviluppando con Claude Code, dalla prima commit alla pubblicazione.
      en: >-
        It started as a birthday card for my wife: the QR code leading to her
        present had to be uncovered by shading in the cells of four puzzles. I
        drew that one by hand in Inkscape; QRiddle is the web app that now
        builds them on its own, and my excuse to learn React and TypeScript by
        building with Claude Code, from the first commit all the way to launch.
    cv:
      it: >-
        Una web app ReactJS/TypeScript sviluppata con Claude Code: esperimento
        di vibe coding, ma testato e revisionato, seguito per intero dalla prima
        commit alla CI/CD fino alla promozione.
      en: >-
        A ReactJS/TypeScript web app built with Claude Code: a vibe coding
        experiment, tested and reviewed, followed end to end from the first
        commit through CI/CD to its launch.
    linkedin:
      it: >-
        Il mio primo esperimento di sviluppo con Claude Code.


        È un wizard che permette di realizzare un biglietto d'auguri stampabile
        che nasconde in un puzzle un messaggio da scoprire.


        L'obiettivo era imparare React e TypeScript realizzando una piccola web
        app, e verificare se con il vibe coding, testato e revisionato, fosse
        possibile portare un progetto dalla prima commit alla CI/CD fino alla
        pubblicazione in breve tempo, senza lesinare sulla qualità.


        Esperimento riuscito.
      en: >-
        My first experiment in building with Claude Code.


        It is a wizard that builds a printable greeting card, one that hides a
        message to be found inside a puzzle.


        The goal was to learn React and TypeScript by building a small web app,
        and to find out whether vibe coding, tested and reviewed, could take a
        project from the first commit through CI/CD to its launch in a short
        time, without cutting corners on quality.


        The experiment worked.
  links:
    - label: danilosanchi.net/qriddle
      url: https://danilosanchi.net/qriddle/
  highlight:
    photo:
      src: /photos/qriddle.webp
      alt:
        it: "Un biglietto d'auguri di QRiddle in fase di risoluzione: il QR code emerge"
        en: "A QRiddle greeting card being solved: the QR code emerges"
- name: JobBoy
  role: author
  period:
    start: "2019-07"
    end: "2025-01"
  channels:
    site:
      it: >-
        Un jobs manager per PHP. Open source, MIT, su Packagist. PHP 7, non più
        mantenuto.
      en: >-
        A jobs manager for PHP. Open source, MIT, on Packagist. PHP 7, no longer
        maintained.
    cv:
      it: >-
        Un jobs manager per PHP. Open source, MIT, su Packagist. PHP 7, non più
        mantenuto.
      en: >-
        A jobs manager for PHP. Open source, MIT, on Packagist. PHP 7, no longer
        maintained.
    linkedin:
      it: >-
        Libreria PHP open source (MIT, su Packagist), job manager


        Permette di definire Long Time Jobs scomponendo il lavoro in piccole
        parti, con soluzioni per gestire memoria, timeout e concorrenza.


        Ispirata a un componente di Akeneo è stata ideata e sviluppata per
        sopperire alle necessità di IdroLAB, ma è una soluzione generica e
        contiene soluzioni e best practice riutilizzabili.


        Supporta fino a PHP 7.4.
      en: >-
        Open source PHP library (MIT, on Packagist), job manager


        It defines long running jobs by breaking the work into small parts, with
        answers for memory, timeouts and concurrency.


        Inspired by a component of Akeneo, it was conceived and built for
        IdroLAB's needs, but it is a generic solution and carries reusable
        practices.


        Supports up to PHP 7.4.
  links:
    - label: Documentation
      url: https://github.com/danielsan80/jobboy-doc/blob/master/doc/jobboy.md
- name: FixtureHandler
  role: author
  period:
    start: "2018-07"
    end: "2025-01"
  channels:
    site:
      it: >-
        Una test utility per le fixture in PHP. Open source, MIT, su Packagist.
        PHP 7, non più mantenuta.
      en: >-
        A test utility for PHP fixtures. Open source, MIT, on Packagist. PHP 7,
        no longer maintained.
    cv:
      it: >-
        Una test utility per le fixture in PHP. Open source, MIT, su Packagist.
        PHP 7, non più mantenuta.
      en: >-
        A test utility for PHP fixtures. Open source, MIT, on Packagist. PHP 7,
        no longer maintained.
    linkedin:
      it: >-
        Libreria PHP open source (MIT, su Packagist), test utility


        Facilitare la gestione delle fixture nei test.


        Consente di definire dipendenze tra fixture in modo esplicito e
        modulare, evitando accoppiamenti rigidi.


        È stata ispirata dal DIC di Symfony e dal DoctrineFixturesBundle ma è
        framework-agnostic.


        Supporta fino a PHP 7.4, ma la aggiornerò a PHP 8 appena avrò necessità
        di usarla in questa versione.
      en: >-
        Open source PHP library (MIT, on Packagist), test utility


        Making fixtures easier to manage in tests.


        It declares dependencies between fixtures explicitly and modularly,
        avoiding rigid coupling.


        It was inspired by Symfony's DIC and by DoctrineFixturesBundle, but it
        is framework-agnostic.


        Supports up to PHP 7.4, but I will move it to PHP 8 as soon as I need
        that version.
  links:
    - label: Repository
      url: https://github.com/danielsan80/fixture-handler
