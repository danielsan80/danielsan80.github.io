- name: Sifone Parlante
  role: author
  period:
    start: "2021-03"
  notes: |-
    L'idea è nata a bordo della MS Acquaviva: quattrocento cabine, e ogni
    intasamento lo scoprivamo quando l'acqua era già sul pavimento. Il primo
    prototipo era un sensore di livello incollato con il nastro americano a un
    sifone di prova in sala macchine. Oggi ne girano una trentina, quasi tutti
    da clienti che mi avevano chiamato due volte per lo stesso lavandino.
  channels:
    site:
      it: Un sensore grande come un tappo che si aggancia al sifone e avvisa sul telefono quando l'acqua comincia a scendere piano, giorni prima che il lavandino si intasi. Firmware, scheda e guscio stampato in 3D sono miei.
      en: A sensor the size of a cork that clips onto the trap and warns on your phone when the water starts draining slowly, days before the sink clogs. Firmware, board and 3D printed shell are mine.
    cv:
      it: Sensore per sifoni che prevede gli intasamenti, con firmware, scheda e guscio stampato in 3D.
      en: A trap sensor that predicts clogs, with firmware, board and 3D printed shell.
    linkedin:
      it: Un sensore che si aggancia al sifone e avvisa prima che il lavandino si intasi. Una trentina in uso, quasi tutti da clienti stanchi di chiamarmi due volte.
      en: A sensor that clips onto the trap and warns before the sink clogs. About thirty in use, mostly by clients tired of calling me twice.
  links:
    - label: Repository
      url: https://example.com/github/mariorossi/sifone-parlante
  highlight:
    photo:
      src: /photos/talking-trap.svg
      alt:
        it: Il Sifone Parlante agganciato sotto un lavandino
        en: The Talking Trap clipped under a sink
- name: Le Fontanelle di Borgo Sifone
  role: author
  period:
    start: "2017-05"
    end: "2019-09"
  channels:
    site:
      it: La mappa di tutte le fontanelle d'acqua potabile di Borgo Sifone, con la portata misurata da me con un secchio e un cronometro. Il comune l'ha adottata, e ora le segnala chiuse prima ancora che arrivi la squadra.
      en: A map of every drinking fountain in Borgo Sifone, with the flow rate I measured myself with a bucket and a stopwatch. The council adopted it, and now flags them as closed before the crew even arrives.
    cv:
      it: Mappa collaborativa delle fontanelle pubbliche, adottata dal comune.
      en: A collaborative map of public drinking fountains, adopted by the council.
  links:
    - label: fontanelle.example.com
      url: https://example.com/fontanelle
  highlight:
    photo:
      src: /photos/drinking-fountains.svg
      alt:
        it: La mappa delle fontanelle, con i punti blu
        en: The fountain map, with its blue dots
- name: OpenRaccordi
  role: contributor
  period:
    start: "2023-02"
    end: "2024-06"
  channels:
    site:
      it: Una libreria OpenSCAD di raccordi idraulici parametrici. Ho aggiunto i raccordi a compressione e le filettature gas, misurate su quelli veri col calibro.
      en: An OpenSCAD library of parametric plumbing fittings. I added the compression fittings and the gas threads, measured with a caliper on real ones.
    cv:
      it: Raccordi a compressione e filettature gas per una libreria OpenSCAD open source.
      en: Compression fittings and gas threads for an open source OpenSCAD library.
  links:
    - label: Repository
      url: https://example.com/github/openraccordi
