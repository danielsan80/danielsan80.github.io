- role:
    it: Consulente idraulico
    en: Plumbing consultant
  company: Rossi Consulenze Idrauliche
  location: Borgo Sifone
  remote: true
  period:
    start: "2026-01"
  channels:
    cv:
      it:
        - Diagnosi delle perdite a distanza, in videochiamata, prima di mandare qualcuno a rompere i muri.
        - Capitolati per condomini che rifanno le colonne montanti.
      en:
        - Remote leak diagnosis, on video calls, before sending anyone to break walls.
        - Specifications for apartment buildings replacing their risers.
    linkedin:
      it: Aiuto condomini e imprese a capire dove perde l'acqua prima di aprire i muri, spesso con una videochiamata e una termocamera in mano al cliente.
      en: I help buildings and contractors find where the water leaks before opening walls, often over a video call with a thermal camera in the client's hand.
