    en: Plumber, then partner
  company: Idraulica Rossi & Figli
  location: Borgo Sifone
  remote: false
  period:
    start: "2006-09"
    end: "2019-03"
  notes: |-
    La bottega l'ha aperta mio nonno nel 1962, con un furgone e una cassetta di
    chiavi che uso ancora. Sono entrato a diciotto anni a portare i tubi; nel
    2013 mio padre mi ha fatto socio, il giorno dopo che ho trovato una perdita
    che lui cercava da una settimana. L'ho lasciata a mio fratello quando sono
    partito per la nave.
